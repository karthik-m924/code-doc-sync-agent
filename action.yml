name: Code-Doc Sync Review
description: Review a pull request against Jira, Confluence, and test evidence.

inputs:
  openai-api-key:
    description: OpenAI project API key
    required: true
  atlassian-site-url:
    description: Atlassian site URL
    required: true
  atlassian-email:
    description: Atlassian account email
    required: true
  atlassian-api-token:
    description: Atlassian API token
    required: true
  confluence-page-id:
    description: Confluence design page ID
    required: true
  github-token:
    description: GitHub token used to read the PR and publish the review
    required: true
  openai-model:
    description: OpenAI model ID
    required: false
    default: gpt-6-sol
  test-paths:
    description: Comma-separated test artifact paths
    required: false
    default: src/test/munit/customer-profile-api-test-suite.xml,src/test/resources/expected-customer-response.json

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Code-Doc Sync Agent
      shell: bash
      run: python -m pip install -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Analyze pull request
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENAI_MODEL: ${{ inputs.openai-model }}
        ATLASSIAN_SITE_URL: ${{ inputs.atlassian-site-url }}
        ATLASSIAN_EMAIL: ${{ inputs.atlassian-email }}
        ATLASSIAN_API_TOKEN: ${{ inputs.atlassian-api-token }}
        CONFLUENCE_PAGE_ID: ${{ inputs.confluence-page-id }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_OWNER: ${{ github.repository_owner }}
        GITHUB_REPO: ${{ github.event.repository.name }}
        GITHUB_TEST_PATHS: ${{ inputs.test-paths }}
        PYTHONPATH: ${{ github.action_path }}/src
      run: >-
        python -m code_doc_sync.review_pr
        --output-dir "$RUNNER_TEMP/code-doc-sync"
        --publish
        --fail-on-inconsistent

