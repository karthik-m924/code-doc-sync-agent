name: Code-Doc Sync Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Code-Doc Sync
    runs-on: ubuntu-latest
    steps:
      - name: Review code and documentation consistency
        uses: karthik-m924/code-doc-sync-agent@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          atlassian-site-url: ${{ vars.ATLASSIAN_SITE_URL }}
          atlassian-email: ${{ secrets.ATLASSIAN_EMAIL }}
          atlassian-api-token: ${{ secrets.ATLASSIAN_API_TOKEN }}
          confluence-page-id: ${{ vars.CONFLUENCE_PAGE_ID }}
          github-token: ${{ github.token }}
